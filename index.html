<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1718"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SNOOKER"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>SNOOKER · Score & Friends</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f6f4;background:#091719;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#19382e 0%,#091719 55%);min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.wrap{max-width:850px;margin:auto;padding:20px 16px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:29px;font-weight:950;letter-spacing:1.5px}.brand b{color:#eab65c}.sub{color:#9fb7ae;font-size:12px;letter-spacing:2px}.pill{border:1px solid #365b4d;border-radius:100px;padding:8px 11px;color:#acd9b8;font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0b2020f5;border-top:1px solid #34534a;padding:8px 6px max(12px,env(safe-area-inset-bottom));z-index:10}.tabs button{background:none;color:#9bb4aa;border:0;flex:1;max-width:165px;padding:9px 2px;font-size:12px}.tabs button.active{color:#f3c67e}.tabs span{display:block;font-size:21px;margin-bottom:4px}.card{background:#122829e8;border:1px solid #2a4b45;border-radius:20px;padding:19px;margin:14px 0;box-shadow:0 8px 26px #0002}h1{font-size:28px;margin:6px 0 16px}h2{font-size:20px;margin:4px 0 14px}h3{margin:8px 0}.muted{color:#a6bbb2;font-size:14px;line-height:1.55}.field{margin:13px 0}.field label{display:block;color:#b8cfc6;font-size:13px;margin-bottom:7px}input,select{width:100%;background:#071a1d;border:1px solid #40615a;color:white;padding:13px;border-radius:11px;min-width:0}input:focus,select:focus{outline:2px solid #eab65c}.btn{border:0;border-radius:12px;padding:13px 16px;background:#e8a84c;color:#17221c;font-weight:800}.btn.alt{background:#28473f;color:#f0f6f2;border:1px solid #45665c}.btn.red{background:#743a3b;color:white}.btn.small{padding:9px 12px;font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.team{border:1px solid #375a50;border-radius:15px;background:#0c2122;padding:15px;min-width:0}.team.current{border-color:#f4bd69;box-shadow:0 0 0 1px #f4bd6955}.team .score{font-size:45px;font-weight:900;line-height:1.2}.team .name{font-size:14px;overflow-wrap:anywhere}.team .players{font-size:12px;color:#a8bfb5;margin-top:5px}.balls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}.ball{height:72px;border:1px solid #ffffff55;border-radius:15px;background:#15302d;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-weight:900}.sphere{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;box-shadow:inset -7px -9px 10px #0005,inset 4px 5px 9px #fff6,0 3px 7px #0007;color:#fff;text-shadow:0 1px 2px #0009}.ball small{font-size:12px;margin-top:4px}.ball:active{transform:scale(.96)}.ball:disabled{opacity:.24;filter:grayscale(1)}.statusline{padding:13px;background:#203b32;border-radius:12px;border:1px solid #52765d;margin:12px 0}.dangerline{border-color:#9b4c4c;background:#422929}.ballcount{font-size:13px;color:#e9c987}.notice{border-left:3px solid #eab65c;padding:10px 13px;background:#24382f;color:#d6e5dc;border-radius:7px;font-size:13px}.history{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #35534a;padding:13px 0}.history:last-child{border:0}.winner{color:#f2c56f;font-weight:800}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#28483e;font-size:12px;color:#c7e6d3}.hidden{display:none!important}.table-art{background:#125d43;border:10px solid #694728;border-radius:70px;max-width:350px;aspect-ratio:1/1.8;margin:12px auto;position:relative;box-shadow:inset 0 0 0 2px #d7b47c}.pocket{position:absolute;width:21px;height:21px;background:#061210;border-radius:50%;transform:translate(-50%,-50%)}.dot{padding:0;border:0;cursor:pointer;z-index:2;position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset -3px -3px 3px #0007,0 1px 3px #0006}.line{position:absolute;top:74%;left:0;right:0;border-top:2px solid #b1d0a255}.darc{position:absolute;top:74%;left:28%;width:44%;height:15%;border:2px solid #b1d0a255;border-top:0;border-radius:0 0 50% 50%}.statsnum{font-size:30px;font-weight:850;color:#f3c57b}.error{color:#ffaaaa}.foot{font-size:12px;color:#9fb4aa;margin-top:20px}details{margin:12px 0}summary{cursor:pointer;font-weight:700}#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);padding:11px 17px;border-radius:12px;background:#e4b56c;color:#15221b;font-weight:700;z-index:20;display:none;max-width:90%;text-align:center}@media(max-width:420px){.wrap{padding:14px 12px 110px}.card{padding:14px}.team .score{font-size:37px}.balls{gap:8px}.ball{height:69px}.brand{font-size:25px}} </style></head><body><div class="wrap"><header class="top"><div><div class="brand">SNOO<b>KER</b> 🎱</div><div class="sub">SCORE & FRIENDS · V1.6</div></div><span class="pill">● LOKAL & OFFLINE</span></header><main id="app"></main><div class="foot">Alle Spielstände werden ausschließlich auf diesem Gerät gespeichert. Für Gerätewechsel bitte ein Backup exportieren.</div></div><nav class="tabs" id="tabs"></nav><div id="toast" role="status"></div><script>
'use strict';const KEY='snooker-friends-v1';const colors=[['Rot',1,'#c9282e'],['Gelb',2,'#f2d338'],['Grün',3,'#1ba360'],['Braun',4,'#986136'],['Blau',5,'#2377e5'],['Pink',6,'#ec79b3'],['Schwarz',7,'#17191e']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={games:[],active:null};try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.games))state={games:v.games,active:v.active||null}}catch(e){}let tab='home',mode='classic',teamCount=2,teamDraft=[{name:'Team 1',players:''},{name:'Team 2',players:''},{name:'Team 3',players:''},{name:'Team 4',players:''}],entry='balls';function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Speichern fehlgeschlagen: Speicher voll?')}}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2800)}function html(s){document.getElementById('app').innerHTML=s}function nav(){document.getElementById('tabs').innerHTML=[['home','🏠','Start'],['play','🎱','Spiel'],['history','📅','Historie'],['stats','📊','Statistik'],['rules','📖','Regeln']].map(([id,ic,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('')}function go(t){tab=t;nav();render()}function render(){if(tab==='home')home();if(tab==='play')play();if(tab==='history')history();if(tab==='stats')stats();if(tab==='rules')rules()}function home(){html(`<h1>Dein Snooker-Abend</h1><div class="card"><h2>${state.active?'Laufendes Spiel':'Neues Spiel starten'}</h2>${state.active?`<p class="muted">${esc(state.active.teams.map(t=>t.name).join(' · '))}</p><button class="btn" onclick="go('play')">Spiel fortsetzen →</button>`:`<div class="field"><label>Spielart</label><select id="mode" onchange="mode=this.value;setupFields()"><option value="classic" ${mode==='classic'?'selected':''}>Klassisch – 2 Teams gegeneinander</option><option value="friends" ${mode==='friends'?'selected':''}>Freizeit – 2 bis 4 Teams</option></select></div><div id="setup"></div><button class="btn" onclick="startGame()">🎱 Spiel starten</button>`}</div><div class="card"><h2>Letzte Ergebnisse</h2>${state.games.length?state.games.slice(0,3).map(g=>resultLine(g)).join(''):'<p class="muted">Noch keine Spiele gespeichert.</p>'}</div><div class="card"><h2>Deine Daten</h2><p class="muted">Die App speichert Spiele offline. Exportiere regelmäßig ein Backup, besonders vor einem Handywechsel.</p><div class="row"><button class="btn alt" onclick="backup()">⬇ Backup (JSON)</button><button class="btn alt" onclick="document.getElementById('import').click()">⬆ Backup importieren</button><input type="file" id="import" accept=".json,application/json" hidden onchange="importBackup(this)"><button class="btn alt" onclick="csv()">⬇ CSV für Excel</button></div></div>`);if(!state.active)setupFields()}function setupFields(){let m=document.getElementById('mode');if(m)mode=m.value;let e=document.getElementById('setup');if(!e)return;e.innerHTML=`${mode==='friends'?`<div class="field"><label>Anzahl Mannschaften</label><select onchange="teamCount=Number(this.value);setupFields()">${[2,3,4].map(n=>`<option ${teamCount===n?'selected':''}>${n}</option>`).join('')}</select></div>`:''}${Array.from({length:mode==='classic'?2:teamCount},(_,i)=>`<div class="grid2"><div class="field"><label>Team ${i+1}</label><input id="team${i}" value="${esc(teamDraft[i].name)}" placeholder="Teamname" oninput="teamDraft[${i}].name=this.value"></div><div class="field"><label>Spieler (optional)</label><input id="players${i}" value="${esc(teamDraft[i].players)}" placeholder="z. B. Alex, Ben" oninput="teamDraft[${i}].players=this.value"></div></div>`).join('')}<p class="muted">${mode==='classic'?'Offizielle Snooker-Zählung mit zwei Seiten.':'Freizeitmodus: Alle Teams sammeln reihum Punkte. Automatische Kugelreihenfolge wie im klassischen Modus.'}</p>`}function startGame(){if(state.active)return go('play');let n=mode==='classic'?2:teamCount;let teams=teamDraft.slice(0,n).map((t,i)=>({name:t.name.trim()||`Team ${i+1}`,players:t.players.trim(),score:0,bestBreak:0}));state.active={id:Date.now(),mode,teams,turn:0,actions:[],started:new Date().toISOString(),breakPoints:0,reds:15,phase:'red',nextColor:2};save();go('play')}
function ensureGame(g){if(!Number.isInteger(g.reds)){g.reds=15;g.phase='red';g.nextColor=2;toast('Altes Spiel: Kugelstand wurde auf 15 Rot zurückgesetzt. Bitte prüfen.')}if(!g.phase)g.phase='red';if(!g.nextColor)g.nextColor=2}
function permitted(g,n){if(g.phase==='red')return n===1&&g.reds>0;if(g.phase==='color')return n>=2&&n<=7;if(g.phase==='final')return n===g.nextColor;return false}
function nextBallLabel(g){if(g.phase==='red')return 'ROT (1)';if(g.phase==='color')return 'BELIEBIGE FARBE (2–7)';if(g.phase==='final')return colors[g.nextColor-1]?.[0].toUpperCase()+' ('+g.nextColor+')';return 'SPIELENDE'}
function play(){let g=state.active;if(!g){html('<div class="card"><h2>Kein laufendes Spiel</h2><p class="muted">Lege zuerst Mannschaften an.</p><button class="btn" onclick="go(\'home\')">Neues Spiel</button></div>');return}ensureGame(g);html(`<div class="row" style="justify-content:space-between"><h1>Live-Spielstand</h1><span class="badge">${g.mode==='classic'?'Klassisch':'Freizeit'}</span></div><div class="grid2">${g.teams.map((t,i)=>`<div class="team ${g.turn===i?'current':''}" onclick="selectTurn(${i})"><div class="name">${esc(t.name)}</div><div class="score">${t.score}</div><div class="players">${esc(t.players)||'Keine Spielernamen'}</div>${g.turn===i?'<span class="badge">● Am Zug</span>':''}</div>`).join('')}</div><div class="card"><h2>Punkte erfassen</h2><div class="statusline"><b>Nächste Kugel: ${nextBallLabel(g)}</b><div class="ballcount">🔴 Noch ${g.reds} von 15 roten Kugeln · ${g.phase==='final'?'Schlussfarben':'Farben werden wieder aufgesetzt'}</div></div><p class="muted">Für <b>${esc(g.teams[g.turn].name)}</b> · Laufendes Break: ${g.breakPoints}</p><div class="row"><button class="btn ${entry==='balls'?'':'alt'} small" onclick="entry='balls';render()">🎱 Kugelfarben</button><button class="btn ${entry==='numbers'?'':'alt'} small" onclick="entry='numbers';render()">🔢 Zahlen</button></div>${entry==='balls'?`<div class="balls">${colors.map(([name,n,color])=>`<button class="ball" ${permitted(g,n)?'':'disabled'} onclick="addPoints(${n})"><span class="sphere" style="background:${color}">${n}</span><small>${name}</small></button>`).join('')}</div>`:`<div class="grid3" style="margin:16px 0">${[1,2,3,4,5,6,7].map(n=>`<button class="btn alt" ${permitted(g,n)?'':'disabled'} onclick="addPoints(${n})">+ ${n} · ${colors[n-1][0]}</button>`).join('')}</div>`}<div class="row"><button class="btn alt" onclick="undo()">↶ Rückgängig</button><button class="btn alt" onclick="nextTurn()">↪ Nächstes Team</button></div><details><summary>Foul / Strafpunkte</summary><p class="muted">Foulpunkte gehen an die Gegenseite (im Freizeitmodus an das nächste Team). Beim Teamwechsel beginnt der neue Spieler mit Rot, solange noch rote Kugeln liegen. Nach der letzten Roten beginnt bei einem Wechsel die Schlussphase.</p><div class="row">${[4,5,6,7].map(n=>`<button class="btn alt small" onclick="foul(${n})">+${n} Foul</button>`).join('')}</div></details><div class="statusline dangerline"><b>Hausregel: Schwarz vorzeitig versenkt</b><p class="muted">Nur antippen, wenn Schwarz regelwidrig vorzeitig fällt. Normales Schwarz nach Rot über die Kugeltaste zählen.</p><button class="btn red" onclick="earlyBlack()">⚫ Schwarz vorzeitig – Spiel beenden</button></div></div><div class="card"><h2>Spielaktionen</h2><p class="muted">${g.actions.length?g.actions.slice(-5).reverse().map(a=>`${esc(g.teams[a.team].name)}: ${a.kind==='turn'?'Teamwechsel':(a.kind==='foul'?'Foul +':'+')+a.points}`).join(' · '):'Noch keine Punkte eingetragen.'}</p><div class="row"><button class="btn" onclick="finish()">🏆 Spiel beenden</button><button class="btn red small" onclick="discard()">Spiel verwerfen</button></div></div>`)}
function snapshot(g){return {turn:g.turn,breakPoints:g.breakPoints,reds:g.reds,phase:g.phase,nextColor:g.nextColor,best:g.teams.map(t=>t.bestBreak)}}
function changeTurn(g,i){
 if(i===g.turn)return false;
 const before=snapshot(g);
 // Jeder neue Spieler beginnt mit Rot, solange noch rote Kugeln vorhanden sind.
 // Nach der letzten Roten beginnt die Schlussphase, falls die letzte Farbchance ausgelassen wurde.
 if(g.reds>0)g.phase='red';
 else if(g.phase==='color'){g.phase='final';g.nextColor=2;}
 g.turn=i;g.breakPoints=0;
 g.actions.push({kind:'turn',team:i,points:0,before});
 return true;
}
function selectTurn(i){let g=state.active;if(!g)return;ensureGame(g);if(changeTurn(g,i)){save();render();toast('Team gewechselt: '+nextBallLabel(g))}}

function addPoints(n){let g=state.active;if(!g)return;ensureGame(g);if(!permitted(g,n))return toast('Diese Kugel ist gerade nicht erlaubt');let before=snapshot(g),i=g.turn;g.teams[i].score+=n;g.breakPoints+=n;g.teams[i].bestBreak=Math.max(g.teams[i].bestBreak,g.breakPoints);if(g.phase==='red'){g.reds--;g.phase='color'}else if(g.phase==='color'){g.phase=g.reds===0?'final':'red';g.nextColor=2}else if(g.phase==='final'){g.nextColor++;if(g.nextColor>7)g.phase='done'}g.actions.push({kind:'pot',team:i,points:n,before});save();if(g.phase==='done'){completeGame('Alle Schlussfarben versenkt');return}render()}
function foul(n){let g=state.active;if(!g)return;let before=snapshot(g),i=g.turn,target=(i+1)%g.teams.length;g.teams[target].score+=n;g.actions.push({kind:'foul',team:target,points:n,before});g.breakPoints=0;save();render();toast(`${n} Strafpunkte für ${g.teams[target].name}`)}
function nextTurn(){let g=state.active;if(!g)return;ensureGame(g);if(changeTurn(g,(g.turn+1)%g.teams.length)){save();render()}}
function undo(){let g=state.active;if(!g||!g.actions.length)return toast('Keine Aktion zum Rückgängigmachen');let a=g.actions.pop();if(a.kind!=='turn')g.teams[a.team].score-=a.points;if(a.before){g.turn=a.before.turn;g.breakPoints=a.before.breakPoints;g.reds=a.before.reds;g.phase=a.before.phase;g.nextColor=a.before.nextColor;g.teams.forEach((t,i)=>t.bestBreak=a.before.best[i]||0)}else{g.turn=a.kind==='foul'?(a.team-1+g.teams.length)%g.teams.length:a.team;g.breakPoints=a.prevBreak||0}save();render()}
function completeGame(reason){let g=state.active;if(!g)return;let max=Math.max(...g.teams.map(t=>t.score));g.winners=g.teams.filter(t=>t.score===max).map(t=>t.name);g.ended=new Date().toISOString();g.endReason=reason;state.games.unshift(g);state.active=null;save();go('history');alert(`${reason}\n\n${g.teams.map(t=>t.name+': '+t.score+' Punkte').join('\n')}\n\n${g.winners.length===1?'Gewinner: '+g.winners[0]:'Unentschieden: '+g.winners.join(', ')}`)}
function earlyBlack(){let g=state.active;if(!g)return;if(!confirm('Schwarz vorzeitig versenkt? Das Spiel wird SOFORT beendet und die bisherigen Punkte werden gewertet.'))return;completeGame('Schwarz vorzeitig versenkt (Hausregel)')}
function finish(){if(!state.active)return;if(!confirm('Spiel beenden und Ergebnis in der Historie speichern?'))return;completeGame('Manuell beendet')}
function discard(){if(confirm('Laufendes Spiel wirklich löschen?')){state.active=null;save();go('home')}}
function formatTime(value){if(!value)return 'Nicht gespeichert';const d=new Date(value);return Number.isNaN(d.getTime())?'Nicht gespeichert':d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' Uhr'}function lastPlayed(){const dated=state.games.filter(g=>g.ended||g.started).sort((a,b)=>new Date(b.ended||b.started)-new Date(a.ended||a.started));return dated[0]||null}function resultLine(g){return `<div class="history"><div><b>${esc(g.teams.map(t=>t.name).join(' · '))}</b><div class="muted">🕒 Beginn: <b>${formatTime(g.started)}</b></div><div class="muted">🏁 Ende: <b>${formatTime(g.ended)}</b></div><div class="muted">${g.mode==='classic'?'Klassisch':'Freizeit'}${g.endReason?' · '+esc(g.endReason):''}</div><div class="winner">🏆 ${esc((g.winners||[]).join(' & ')||'Unentschieden')}</div></div><div style="font-weight:850;white-space:nowrap">${g.teams.map(t=>t.score).join(' : ')}</div></div>`}function history(){let last=lastPlayed();let ordered=[...state.games].sort((a,b)=>new Date(b.ended||b.started||0)-new Date(a.ended||a.started||0));html(`<h1>Spielhistorie</h1><div class="card"><h2>🕒 Zuletzt gespielt</h2>${last?`<div class="statsnum" style="font-size:23px">${formatTime(last.ended||last.started)}</div><p class="muted">${esc(last.teams.map(t=>t.name).join(' · '))}</p>`:'<p class="muted">Noch kein abgeschlossenes Spiel vorhanden.</p>'}</div><div class="card"><h2>Alle Spiele</h2>${ordered.length?ordered.map(g=>resultLine(g)).join(''):'<p class="muted">Hier erscheinen eure abgeschlossenen Spiele mit Beginn und Ende (Datum und Uhrzeit).</p>'}</div><div class="row"><button class="btn alt" onclick="csv()">CSV exportieren</button><button class="btn alt" onclick="backup()">Backup exportieren</button></div>`)}function stats(){let games=state.games;let teamMap={};games.forEach(g=>g.teams.forEach(t=>{let k=t.name;let s=teamMap[k]||(teamMap[k]={games:0,wins:0,points:0,best:0});s.games++;s.points+=t.score;s.best=Math.max(s.best,t.bestBreak||0);if((g.winners||[]).includes(k))s.wins++}));let items=Object.entries(teamMap).sort((a,b)=>b[1].wins-a[1].wins);html(`<h1>Statistiken</h1><div class="grid2"><div class="card"><div class="statsnum">${games.length}</div><div class="muted">Gespielte Partien</div></div><div class="card"><div class="statsnum">${items.length}</div><div class="muted">Verschiedene Teams</div></div></div><div class="card"><h2>Team-Rangliste</h2>${items.length?items.map(([name,s],i)=>`<div class="history"><div><b>${i+1}. ${esc(name)}</b><div class="muted">${s.games} Spiele · ${s.points} Punkte · bestes Break ${s.best}</div></div><span class="winner">${s.wins} Siege</span></div>`).join(''):'<p class="muted">Nach dem ersten abgeschlossenen Spiel erscheinen hier Statistiken.</p>'}</div>`)}function rules(){let pockets=[[0,0],[100,0],[0,50],[100,50],[0,100],[100,100]];let dots=[['#e7e7e7',50,85],['#e4cf30',28,74],['#24974c',72,74],['#936037',50,74],['#2369e3',50,50],['#e47db1',50,32],['#141414',50,9]];for(let r=0;r<5;r++)for(let c=0;c<=r;c++)dots.push(['#c71d2a',50+(c-r/2)*5,29-r*2.15]);html(`<h1>Regeln & Tischaufbau</h1><div class="card"><h2>Wo liegen die Kugeln?</h2><p class="muted">Tippe auf eine Kugel für Position und Punktwert.</p><div class="table-art">${pockets.map(([x,y])=>`<i class="pocket" style="left:${x}%;top:${y}%"></i>`).join('')}<i class="line"></i><i class="darc"></i>${dots.map(([c,x,y])=>`<button type="button" class="dot" aria-label="${c==='#c71d2a'?'Rot':c==='#e47db1'?'Pink':c==='#141414'?'Schwarz':c==='#2369e3'?'Blau':c==='#936037'?'Braun':c==='#24974c'?'Grün':c==='#e4cf30'?'Gelb':'Weiß'}" title="Kugel antippen" onclick="ballInfo('${c}')" style="background:${c};left:${x}%;top:${y}%"></button>`).join('')}</div><p class="muted">Draufsicht vom Anstoßende (unten): Die 15 Roten stehen mit der Spitze zur pinken Kugel (Richtung Tischmitte), ohne sie zu berühren. Schwarz liegt hinter der breiten roten Dreiecksseite Richtung oberer Kopfbande. Blau steht mittig. Gelb links, Braun mittig, Grün rechts auf der Baulk-Linie. Weiß darf beim Anstoß frei innerhalb des D platziert werden. Kugel antippen für Informationen.</p></div><div class="card"><h2>Farbwerte</h2><div class="grid2">${colors.map(([name,n,c])=>`<div class="row"><span class="sphere" style="width:28px;height:28px;background:${c}"></span><span>${name}: <b>${n}</b></span></div>`).join('')}</div></div><div class="card"><h2>Kurzregeln</h2><p class="muted">Im klassischen Snooker wird zunächst abwechselnd eine rote Kugel (1 Punkt) und eine beliebige Farbe (2–7 Punkte) gespielt. Solange rote Kugeln vorhanden sind, kommen versenkte Farben wieder auf ihre Markierung. Nach der letzten Roten darf noch eine Farbe nach Wahl gespielt werden; erst danach werden Gelb, Grün, Braun, Blau, Pink und Schwarz in dieser Reihenfolge endgültig versenkt.</p><p class="muted">Bei Fouls erhält der Gegner je nach Situation mindestens 4 und höchstens 7 Punkte. Der Sieger eines Frames ist die Seite mit den meisten Punkten nach dem Ende des Frames. Bei Gleichstand wird im offiziellen Spiel die schwarze Kugel erneut aufgesetzt.</p><div class="notice">Hinweis: Die Abbildung zeigt die richtige Reihenfolge und relative Anordnung der Spots; die Kugelabstände sind für kleine Handybildschirme vereinfacht. Beide Spielarten verwenden die automatische Kugelreihenfolge. Die Hausregel „Schwarz vorzeitig“ beendet ein Spiel sofort. Fouls und Sonderfälle werden nicht vollständig automatisch geprüft.</div></div>`)}function ballInfo(c){const info={'#e7e7e7':'Weiß: Spielball. Beim Anstoß innerhalb des D frei platzieren.','#e4cf30':'Gelb: 2 Punkte. Auf der Baulk-Linie links (vom Anstoßende gesehen).','#24974c':'Grün: 3 Punkte. Auf der Baulk-Linie rechts (vom Anstoßende gesehen).','#936037':'Braun: 4 Punkte. Mittelpunkt der Baulk-Linie.','#2369e3':'Blau: 5 Punkte. Exakt in der Tischmitte.','#e47db1':'Pink: 6 Punkte. Auf dem Pink-Spot unmittelbar vor der Spitze des roten Dreiecks in Richtung Tischmitte.','#141414':'Schwarz: 7 Punkte. Black-Spot zwischen rotem Dreieck und oberer kurzen Bande.','#c71d2a':'Rot: 1 Punkt pro Kugel. 15 Kugeln bilden ein enges Dreieck; die Spitze zeigt Richtung Pink.'};toast(info[c]||'Snookerkugel')}function download(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}function backup(){download('SNOOKER-Backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({app:'SNOOKER',version:1,exported:new Date().toISOString(),...state},null,2)],{type:'application/json'}))}async function importBackup(el){let f=el.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.games)||!('active' in data))throw Error('Ungültige Datei');if(!confirm('Bestehende Historie und laufendes Spiel durch das Backup ersetzen?'))return;state={games:data.games,active:data.active};save();go('home');toast('Backup importiert')}catch(e){toast('Import fehlgeschlagen: ungültiges Backup')}finally{el.value=''}}function csv(){let rows=[['Spielbeginn','Spielende','Spielart','Team','Spieler','Punkte','Gewonnen','Bestes Break']];state.games.forEach(g=>g.teams.forEach(t=>rows.push([g.started||'',g.ended||'',g.mode==='classic'?'Klassisch':'Freizeit',t.name,t.players,t.score,(g.winners||[]).includes(t.name)?'Ja':'Nein',t.bestBreak||0])));let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');download('SNOOKER-Ergebnisse.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}))}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));nav();render();
</script></body></html>
